[project]
name = "simple-streaming-pipeline"
version = "0.1.0"
description = "IoT streaming pipeline with Spark Structured Streaming, Kafka, and Delta Lake"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=2.4.0",
    "kafka-python>=2.0.2",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
